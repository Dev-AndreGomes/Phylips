<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status do Estacionamento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 5px;
        }
        .status-header {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        .resumo-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            text-align: center;
        }
        .card .numero {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }
        .livres { color: #28a745; }
        .ocupadas { color: #dc3545; }
        .total { color: #007bff; }
        
        .secao-andares {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }
        .andar-card {
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 15px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .andar-nome {
            font-size: 18px;
            font-weight: bold;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background: #eafaf1;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Painel do Estacionamento</h1>
        <div class="status-header">
            Última atualização: <span id="updated-at">--:--:--</span> (Atualiza a cada 2 segundos)
        </div>

        <!-- Cards com o Resumo Geral -->
        <div class="resumo-cards">
            <div class="card">
                <div>Total de Vagas</div>
                <div id="total-geral" class="numero total">0</div>
            </div>
            <div class="card">
                <div>Vagas Livres</div>
                <div id="livres-geral" class="numero livres">0</div>
            </div>
            <div class="card">
                <div>Vagas Ocupadas</div>
                <div id="ocupadas-geral" class="numero ocupadas">0</div>
            </div>
        </div>

        <!-- Lista de Andares -->
        <div class="secao-andares">
            <h2>Disponibilidade por Andar</h2>
            <div id="lista-andares">
                <p>Carregando informações...</p>
            </div>
        </div>
    </div>

    <script>
        async function atualizarDados() {
            try {
                const response = await fetch('/api/vagas');
                if (!response.ok) return;

                const data = await response.json();

                // Atualiza os contadores gerais
                document.getElementById('updated-at').textContent = data.updated_at || '--:--:--';
                document.getElementById('total-geral').textContent = data.total_geral || 0;
                document.getElementById('livres-geral').textContent = data.livres_geral || 0;
                document.getElementById('ocupadas-geral').textContent = data.ocupadas_geral || 0;

                // Atualiza a lista por andar
                const listaAndares = document.getElementById('lista-andares');
                if (data.andares && data.andares.length > 0) {
                    listaAndares.innerHTML = data.andares.map(andar => `
                        <div class="andar-card">
                            <div>
                                <div class="andar-nome">${andar.nome}</div>
                                <small style="color: #666;">Total: ${andar.total} vagas | Ocupadas: ${andar.ocupadas}</small>
                            </div>
                            <div>
                                <span class="badge">${andar.livres} vagas livres</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('Erro ao buscar dados do estacionamento:', err);
            }
        }

        // Executa imediatamente ao abrir a página
        atualizarDados();

        // Consulta a API a cada 2 segundos para atualizar em tempo real
        setInterval(atualizarDados, 2000);
    </script>
</body>
</html>
