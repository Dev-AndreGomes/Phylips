<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Estacionamento - IA ao Vivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        
        /* Cabeçalho */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
        }
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Subtítulo */
        .sub-header {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* Cards Principais */
        .resumo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background: #1e293b;
            padding: 22px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .card-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .card-valor {
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
        }
        .livres { color: #22c55e; }
        .ocupadas { color: #ef4444; }
        .total { color: #38bdf8; }

        /* Barra de Lotação */
        .lotacao-container {
            background: #1e293b;
            padding: 18px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 25px;
        }
        .lotacao-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        .progress-bar-bg {
            background: #334155;
            height: 12px;
            border-radius: 9999px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #22c55e;
            width: 0%;
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        /* Seção de Andares */
        .andares-secao {
            background: #1e293b;
            padding: 22px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .andares-titulo {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .andar-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px 20px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .andar-info-nome {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tag-status {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .tag-live {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .tag-placeholder {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .andar-info-sub {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }
        .andar-vagas-badge {
            font-size: 15px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .andar-vagas-badge.lotado {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 600px) {
            .resumo-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Cabeçalho com Status ao Vivo -->
        <div class="header">
            <h1>Monitoramento de Estacionamento</h1>
            <div class="live-indicator">
                <span class="dot"></span>
                <span>IA Ao Vivo Conectada</span>
            </div>
        </div>

        <div class="sub-header">
            Câmera do Estacionamento (Visão Superior) • Última leitura: <strong id="updated-at" style="color: #f8fafc;">--:--:--</strong>
        </div>

        <!-- Cards com as métricas reais da Câmera -->
        <div class="resumo-grid">
            <div class="card">
                <div class="card-label">Total de Vagas</div>
                <div id="total-geral" class="card-valor total">--</div>
            </div>
            <div class="card">
                <div class="card-label">Vagas Disponíveis</div>
                <div id="livres-geral" class="card-valor livres">--</div>
            </div>
            <div class="card">
                <div class="card-label">Vagas Ocupadas</div>
                <div id="ocupadas-geral" class="card-valor ocupadas">--</div>
            </div>
        </div>

        <!-- Barra de Lotação Geral -->
        <div class="lotacao-container">
            <div class="lotacao-header">
                <span>Taxa de Ocupação da Câmera</span>
                <span id="taxa-ocupacao">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="barra-progresso" class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Seção de Andares / Câmeras -->
        <div class="andares-secao">
            <div class="andares-titulo">
                <span>Disponibilidade por Andar / Setor</span>
                <span style="font-size: 12px; color: #64748b; font-weight: normal;">Atualização a cada 2s</span>
            </div>

            <div id="lista-andares">
                <p style="color: #64748b; font-size: 14px;">Aguardando dados da IA...</p>
            </div>
        </div>

    </div>

    <script>
        async function atualizarDados() {
            try {
                const response = await fetch('/api/vagas');
                if (!response.ok) return;

                const data = await response.json();

                // 1. Atualiza os dados reais vindos da visão computacional
                document.getElementById('updated-at').textContent = data.updated_at || '--:--:--';
                
                const total = data.total_geral || 0;
                const livres = data.livres_geral || 0;
                const ocupadas = data.ocupadas_geral || 0;

                document.getElementById('total-geral').textContent = total;
                document.getElementById('livres-geral').textContent = livres;
                document.getElementById('ocupadas-geral').textContent = ocupadas;

                // 2. Calcula e atualiza a barra de lotação
                const percentualOcupado = total > 0 ? Math.round((ocupadas / total) * 100) : 0;
                document.getElementById('taxa-ocupacao').textContent = percentualOcupado + '% ocupado';
                
                const barra = document.getElementById('barra-progresso');
                barra.style.width = percentualOcupado + '%';

                // Cor dinâmica da barra: verde (< 70%), amarelo (70-89%), vermelho (>= 90%)
                if (percentualOcupado >= 90) {
                    barra.style.backgroundColor = '#ef4444';
                } else if (percentualOcupado >= 70) {
                    barra.style.backgroundColor = '#f59e0b';
                } else {
                    barra.style.backgroundColor = '#22c55e';
                }

                // 3. Renderiza os andares (diferenciando o ao vivo dos placeholders)
                const listaAndares = document.getElementById('lista-andares');
                if (data.andares && data.andares.length > 0) {
                    listaAndares.innerHTML = data.andares.map(andar => {
                        const isLive = andar.is_live;
                        const tagHtml = isLive 
                            ? `<span class="tag-status tag-live">● Ao Vivo</span>` 
                            : `<span class="tag-status tag-placeholder">Placeholder / Exemplo</span>`;
                        
                        const isLotado = andar.livres === 0;

                        return `
                            <div class="andar-card">
                                <div>
                                    <div class="andar-info-nome">
                                        <span>${andar.nome}</span>
                                        ${tagHtml}
                                    </div>
                                    <div class="andar-info-sub">
                                        Total: ${andar.total} vagas | Ocupadas: ${andar.ocupadas}
                                    </div>
                                </div>
                                <div>
                                    <span class="andar-vagas-badge ${isLotado ? 'lotado' : ''}">
                                        ${andar.livres} ${andar.livres === 1 ? 'vaga livre' : 'vagas livres'}
                                    </span>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                console.error('Erro ao conectar na API:', err);
            }
        }

        // Executa imediatamente ao abrir e depois a cada 2 segundos
        atualizarDados();
        setInterval(atualizarDados, 2000);
    </script>
</body>
</html>
